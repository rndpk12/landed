spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
      minimum-idle: ${DB_MIN_IDLE:2}
  jpa:
    show-sql: false

app:
  storage:
    type: ${RESUME_STORAGE_TYPE:s3}

server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.springframework.security: WARN
