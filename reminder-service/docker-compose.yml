services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-landed}
      POSTGRES_USER: ${POSTGRES_USER:-landed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-landed-local-password}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - reminder_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - reminder_redis_data:/data

  web:
    build: .
    environment:
      RAILS_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-landed}:${POSTGRES_PASSWORD:-landed-local-password}@postgres:5432/${POSTGRES_DB:-landed}}
      REDIS_URL: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to the same Base64 secret used by Landed}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "bundle exec rails db:migrate && bundle exec puma -C config/puma.rb"

  sidekiq:
    build: .
    environment:
      RAILS_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-landed}:${POSTGRES_PASSWORD:-landed-local-password}@postgres:5432/${POSTGRES_DB:-landed}}
      REDIS_URL: redis://redis:6379/1
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to the same Base64 secret used by Landed}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: bundle exec sidekiq -C config/sidekiq.yml

volumes:
  reminder_postgres_data:
  reminder_redis_data:
